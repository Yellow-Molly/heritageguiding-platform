name: Lighthouse CI

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main, staging]

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: read
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vercel auto-deploys every commit/PR. Wait for that deployment instead
      # of building+migrating locally — avoids needing DATABASE_URL secrets
      # (which Dependabot PRs cannot access) and seed data for live tour pages.
      - name: Wait for Vercel deployment
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse against deployment
        working-directory: apps/web
        env:
          LHCI_BASE_URL: ${{ steps.vercel.outputs.url }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: lhci autorun
