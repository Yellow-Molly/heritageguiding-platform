name: Lighthouse CI

# PR-only: Vercel auto-creates a Preview deployment for every PR. Auditing
# that URL avoids needing local DATABASE_URL/seed data. Master-push deploys
# go to Vercel Production, which is configured separately and not audited
# here (Lighthouse on PRs catches regressions before merge).
on:
  pull_request:
    branches: [master, main, staging]

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: read
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel Preview deployment
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: Preview
          max_timeout: 600
          check_interval: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse against deployment
        working-directory: apps/web
        env:
          LHCI_BASE_URL: ${{ steps.vercel.outputs.url }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: lhci autorun
